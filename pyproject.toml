[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanopore-merged-lab"
version = "0.1.0"
description = "Merged nanopore ABF analysis and interactive review suite"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.0", "scipy>=1.12", "matplotlib>=3.8", "openpyxl>=3.1", "xlrd>=2.0"]

[project.optional-dependencies]
review = ["pyabf>=2.3", "PyQt5>=5.15", "pyqtgraph>=0.13"]
dev = ["pytest>=8.0"]

[project.scripts]
nanopore-prior = "nanopore_prior.cli:main"
nanopore-review = "nanopore.cli:main"

[tool.setuptools]
packages = ["nanopore_prior", "nanopore", "nanopore.gui"]
py-modules = ["merged_runner"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_prior", "tests_merged"]
